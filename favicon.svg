<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0a1f10"/>
      <stop offset="100%" stop-color="#050a06"/>
    </radialGradient>
    <filter id="phosphor" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="0.6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="64" height="64" rx="10" fill="url(#glow)"/>

  <g filter="url(#phosphor)" fill="none" stroke="#7cff9e" stroke-linecap="round" stroke-linejoin="round">
    <g>
      <animateTransform attributeName="transform" type="rotate"
        from="0 32 32" to="360 32 32" dur="4s" repeatCount="indefinite"/>
      <circle cx="32" cy="32" r="20" stroke-width="2.5"/>
      <circle cx="32" cy="32" r="13" stroke-width="1.2" stroke-opacity="0.55"/>
      <g stroke-width="2.2">
        <line x1="32" y1="12" x2="32" y2="6"/>
        <line x1="32" y1="52" x2="32" y2="58"/>
        <line x1="12" y1="32" x2="6" y2="32"/>
        <line x1="52" y1="32" x2="58" y2="32"/>
      </g>
      <g fill="#7cff9e" stroke="none">
        <rect x="30" y="4" width="4" height="4"/>
        <rect x="30" y="56" width="4" height="4"/>
        <rect x="4" y="30" width="4" height="4"/>
        <rect x="56" y="30" width="4" height="4"/>
      </g>
      <g stroke-width="1" stroke-opacity="0.7">
        <line x1="18" y1="18" x2="22" y2="22"/>
        <line x1="46" y1="18" x2="42" y2="22"/>
        <line x1="18" y1="46" x2="22" y2="42"/>
        <line x1="46" y1="46" x2="42" y2="42"/>
      </g>
    </g>

    <g stroke-width="1.4" stroke-opacity="0.95">
      <line x1="32" y1="24" x2="32" y2="29"/>
      <line x1="32" y1="35" x2="32" y2="40"/>
      <line x1="24" y1="32" x2="29" y2="32"/>
      <line x1="35" y1="32" x2="40" y2="32"/>
    </g>
    <circle cx="32" cy="32" r="1.6" fill="#7cff9e" stroke="none">
      <animate attributeName="opacity" values="1;0.3;1" dur="1.2s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
